name: Build Zygisk Module

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    name: Build Module (${{ matrix.arch }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64, x86]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Android NDK
        run: |
          echo "Downloading Android NDK r26c..."
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip
          echo "ANDROID_NDK_HOME=${GITHUB_WORKSPACE}/android-ndk-r26c" >> $GITHUB_ENV
          echo "${GITHUB_WORKSPACE}/android-ndk-r26c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          
      - name: Build module for ${{ matrix.arch }}
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh ${{ matrix.arch }}
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mymod-${{ matrix.arch }}
          path: |
            module/zygisk/${{ matrix.arch }}/mymod.so
            module/module.prop
            module/config
          retention-days: 30
          if-no-files-found: error

  package:
    name: Create Release Package
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create module package
        run: |
          mkdir -p mymod/zygisk
          
          # Copy all architectures
          for arch in arm64-v8a armeabi-v7a x86_64 x86; do
            if [ -d "artifacts/mymod-${arch}" ]; then
              mkdir -p mymod/zygisk/${arch}
              cp -r artifacts/mymod-${arch}/* mymod/zygisk/${arch}/ 2>/dev/null || true
            fi
          done
          
          # Copy module files
          cp module/module.prop mymod/
          cp module/config mymod/
          
          # Create ZIP
          cd mymod
          zip -r ../mymod-release.zip *
          cd ..
          
          echo "Package created: mymod-release.zip"
          ls -lh mymod-release.zip
          
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: mymod-release
          path: mymod-release.zip
          
      - name: Attach to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./mymod-release.zip
          asset_name: mymod-${{ github.ref_name }}.zip
          asset_content_type: application/zip
